# 质量门禁：校验资讯结构，并做静态语法检查。
# 每日一次，作为持续优化的机械底线。
name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate news schema
        run: node scripts/validate-news.js

      - name: Syntax-check Node scripts
        run: |
          node --check scripts/fetch-news.js
          node --check scripts/validate-news.js

      - name: Syntax-check frontend
        run: node --check script.js
