# 抓取资讯并部署到 GitHub Pages。抓取与部署必须在同一 job，
# 避免「更新已 push、部署仍用旧 SHA」的竞态。
name: Deploy and Update

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and validate news
        id: fetch
        continue-on-error: true
        env:
          AI_NEWS_TRANSLATE: '1'
        run: |
          chmod +x scripts/update.sh
          ./scripts/update.sh

      - name: Commit news update
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/news.json data/translation_cache.json
          if git diff --staged --quiet; then
            echo "资讯无变化"
          else
            git commit -m "Auto-update news: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Validate existing news if fetch skipped
        if: steps.fetch.outcome != 'success'
        run: node scripts/validate-news.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
